[project]
name = "railvox-agent"
version = "0.1.0"
description = "RailVox — Voice-native Indian railway search assistant (LiveKit Agent)"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.5.0",
    "livekit-plugins-rime>=1.5.0",
    "livekit-plugins-deepgram>=1.5.0",
    "livekit-plugins-groq>=0.1.0",
    "livekit-plugins-silero>=1.5.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
